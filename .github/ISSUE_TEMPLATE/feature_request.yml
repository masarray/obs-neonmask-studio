name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user need
      description: Describe the workflow problem before proposing the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable result would make this complete?
    validations:
      required: true
